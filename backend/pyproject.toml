[tool.poetry]
name = "backend"
version = "0.2.0"
description = "screenshot-to-code backend on LangChain Deep Agents + OpenRouter"
authors = ["Abi Raja <abimanyuraja@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.6"
python-multipart = "^0.0.20"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
websockets = ">=15.0"
python-dotenv = "^1.0.0"
beautifulsoup4 = "^4.12.2"
httpx = "^0.28.1"
pre-commit = "^3.6.2"
moviepy = "^1.0.3"
pillow = "^10.3.0"
types-pillow = "^10.2.0.20240520"
aiohttp = "^3.9.5"
pydantic = "^2.10"
playwright = "^1.61.0"
pillow-heif = "^0.18.0"
# --- LLM stack: LangChain Deep Agents over OpenRouter (single API key) ---
deepagents = "0.7.13"
langchain = "^1.4.0"
langchain-core = "^1.6.3"
langgraph = "^1.2.11"
langchain-openrouter = "0.2.8"
openrouter = "^0.11.46"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pyright = "^1.1.352"
pytest-asyncio = "^0.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
